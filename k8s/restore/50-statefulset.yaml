# RS-1 (ADR-0006): a 3-pod Patroni cluster whose bootstrap restores the live stanza. No backup sidecar, no pgserver.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pg-restore
  namespace: pg-restore
  labels:
    application: pg-restore
    cluster-name: pg-restore
spec:
  serviceName: pg-restore-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      application: pg-restore
      cluster-name: pg-restore
  template:
    metadata:
      labels:
        application: pg-restore
        cluster-name: pg-restore
    spec:
      serviceAccountName: patroni
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  application: pg-restore
                  cluster-name: pg-restore
      containers:
        - name: postgres
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
            - name: patroni
              containerPort: 8008
          envFrom:
            - configMapRef:
                name: pgbackrest-env
          env:
            - name: PATRONI_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PATRONI_KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: PATRONI_KUBERNETES_POD_IP
              value: "$(POD_IP)"
            - name: PATRONI_RESTAPI_CONNECT_ADDRESS
              value: "$(POD_IP):8008"
            - name: PATRONI_POSTGRESQL_CONNECT_ADDRESS
              value: "$(POD_IP):5432"
            - name: PATRONI_SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-credentials
                  key: superuser-password
            - name: PATRONI_REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-credentials
                  key: replication-password
            - name: PATRONI_REWIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-credentials
                  key: rewind-password
            - name: PATRONI_RESTAPI_USERNAME
              value: patroni
            - name: PATRONI_RESTAPI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-credentials
                  key: restapi-password
            - name: PGBACKREST_REPO1_S3_KEY
              valueFrom:
                secretKeyRef:
                  name: objstore-credentials
                  key: access-key-id
            - name: PGBACKREST_REPO1_S3_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: objstore-credentials
                  key: secret-access-key
          startupProbe:
            httpGet:
              path: /liveness
              port: 8008
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /liveness
              port: 8008
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8008
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /pgdata
            - name: patroni-config
              mountPath: /etc/patroni
              readOnly: true
            - name: run
              mountPath: /run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/postgres
            - name: objstore-ca
              mountPath: /certs
              readOnly: true
      volumes:
        - name: patroni-config
          configMap:
            name: patroni-static-config
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
        - name: objstore-ca
          secret:
            secretName: objstore-ca
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
