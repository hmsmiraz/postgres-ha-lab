apiVersion: v1
kind: ServiceAccount
metadata:
  name: patroni
  namespace: pg-restore
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: patroni
  namespace: pg-restore
rules:
  # Leader lock, cluster config and sync state live in ConfigMaps.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "patch", "update", "watch", "delete", "deletecollection"]
  # Patroni sets the role label on its own pod.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "patch", "update", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: patroni
  namespace: pg-restore
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: patroni
subjects:
  - kind: ServiceAccount
    name: patroni
    namespace: pg-restore
