# Garage listens on loopback only. nginx is the only listener reachable from the pod network.
# No secret is stored here: the rpc secret and the admin token come from the objstore-admin Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: objstore-config
  namespace: pg-ha
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "sqlite"
    replication_factor = 1
    rpc_bind_addr = "127.0.0.1:3901"
    rpc_public_addr = "127.0.0.1:3901"

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "127.0.0.1:3910"

    [admin]
    api_bind_addr = "127.0.0.1:3913"
  nginx-s3.conf: |
    server {
      listen 3900 ssl;
      ssl_certificate     /etc/nginx/tls/tls.crt;
      ssl_certificate_key /etc/nginx/tls/tls.key;
      ssl_protocols       TLSv1.2 TLSv1.3;
      client_max_body_size 0;
      location / {
        proxy_pass http://127.0.0.1:3910;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
      }
    }
    server {
      listen 3903 ssl;
      ssl_certificate     /etc/nginx/tls/tls.crt;
      ssl_certificate_key /etc/nginx/tls/tls.key;
      ssl_protocols       TLSv1.2 TLSv1.3;
      location / {
        proxy_pass http://127.0.0.1:3913;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
      }
    }
