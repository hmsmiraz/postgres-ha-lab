# Only the two TLS ports are exposed. Garage's own ports stay on loopback inside the pod.
apiVersion: v1
kind: Service
metadata:
  name: objstore
  namespace: pg-ha
  labels:
    app: objstore
spec:
  selector:
    app: objstore
  ports:
    - name: s3
      port: 3900
      targetPort: 3900
    - name: admin
      port: 3903
      targetPort: 3903
