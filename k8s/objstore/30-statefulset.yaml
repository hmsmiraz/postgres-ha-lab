apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: objstore
  namespace: pg-ha
  labels:
    app: objstore
spec:
  serviceName: objstore
  replicas: 1
  selector:
    matchLabels:
      app: objstore
  template:
    metadata:
      labels:
        app: objstore
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-dirs
          image: __PROXY_IMAGE__
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "mkdir -p /var/lib/garage/meta /var/lib/garage/data"]
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/garage
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      containers:
        - name: garage
          image: __GARAGE_IMAGE__
          imagePullPolicy: IfNotPresent
          env:
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef:
                  name: objstore-admin
                  key: rpc-secret
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: objstore-admin
                  key: admin-token
          readinessProbe:
            exec:
              command: ["/garage", "status"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["/garage", "status"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/garage
            - name: config
              mountPath: /etc/garage.toml
              subPath: garage.toml
              readOnly: true
        - name: tls
          image: __PROXY_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: s3
              containerPort: 3900
            - name: admin
              containerPort: 3903
          readinessProbe:
            tcpSocket:
              port: 3900
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3900
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx-s3.conf
              readOnly: true
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: objstore-config
        - name: tls
          secret:
            secretName: objstore-tls
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
