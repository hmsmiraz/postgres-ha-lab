# SEC-3 (option C): ingress policies on the Postgres pods and the object store only.
# A pod selected by an ingress policy accepts only what is listed. Egress is not restricted.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pg-ha-ingress
  namespace: pg-ha
spec:
  podSelector:
    matchLabels:
      application: pg-ha
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              application: pg-ha
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8008
    - from:
        - podSelector:
            matchLabels:
              app: write-probe
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 8008
        - protocol: TCP
          port: 9187
    - from:
        - podSelector:
            matchExpressions:
              - key: batch.kubernetes.io/job-name
                operator: Exists
      ports:
        - protocol: TCP
          port: 8432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: objstore-ingress
  namespace: pg-ha
spec:
  podSelector:
    matchLabels:
      app: objstore
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              application: pg-ha
        - podSelector:
            matchExpressions:
              - key: batch.kubernetes.io/job-name
                operator: Exists
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pg-restore
      ports:
        - protocol: TCP
          port: 3900
        - protocol: TCP
          port: 3903
