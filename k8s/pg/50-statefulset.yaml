apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pg-ha
  namespace: pg-ha
  labels:
    application: pg-ha
    cluster-name: pg-ha
spec:
  serviceName: pg-ha-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      application: pg-ha
      cluster-name: pg-ha
  template:
    metadata:
      labels:
        application: pg-ha
        cluster-name: pg-ha
    spec:
      serviceAccountName: patroni
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  application: pg-ha
                  cluster-name: pg-ha
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              application: pg-ha
              cluster-name: pg-ha
      containers:
        - name: postgres
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
            - name: patroni
              containerPort: 8008
          envFrom:
            - configMapRef:
                name: pgbackrest-env
          env:
            - name: PATRONI_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PATRONI_KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: PATRONI_KUBERNETES_POD_IP
              value: "$(POD_IP)"
            - name: PATRONI_RESTAPI_CONNECT_ADDRESS
              value: "$(POD_IP):8008"
            - name: PATRONI_POSTGRESQL_CONNECT_ADDRESS
              value: "$(POD_IP):5432"
            - name: PATRONI_SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-credentials
                  key: superuser-password
            - name: PATRONI_REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-credentials
                  key: replication-password
            - name: PATRONI_REWIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-credentials
                  key: rewind-password
            - name: PATRONI_RESTAPI_USERNAME
              value: patroni
            - name: PATRONI_RESTAPI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-credentials
                  key: restapi-password
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-credentials
                  key: app-password
            - name: PGBACKREST_REPO1_S3_KEY
              valueFrom:
                secretKeyRef:
                  name: objstore-credentials
                  key: access-key-id
            - name: PGBACKREST_REPO1_S3_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: objstore-credentials
                  key: secret-access-key
          startupProbe:
            httpGet:
              path: /liveness
              port: 8008
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /liveness
              port: 8008
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8008
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /pgdata
            - name: patroni-config
              mountPath: /etc/patroni
              readOnly: true
            - name: run
              mountPath: /run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/postgres
            - name: objstore-ca
              mountPath: /certs
              readOnly: true
        - name: backup
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          command: ["sh", "/scripts/backup-loop.sh"]
          envFrom:
            - configMapRef:
                name: pgbackrest-env
          env:
            - name: PGBACKREST_REPO1_S3_KEY
              valueFrom:
                secretKeyRef:
                  name: objstore-credentials
                  key: access-key-id
            - name: PGBACKREST_REPO1_S3_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: objstore-credentials
                  key: secret-access-key
            - name: PGHOST
              value: /run/postgresql
            - name: PGUSER
              value: postgres
            - name: PGDATABASE
              value: postgres
            - name: PGCONNECT_TIMEOUT
              value: "5"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /pgdata
              readOnly: true
            - name: run
              mountPath: /run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: objstore-ca
              mountPath: /certs
              readOnly: true
            - name: backup-scripts
              mountPath: /scripts
              readOnly: true
        - name: pgserver
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          command: ["pgbackrest", "server"]
          ports:
            - name: pgbackrest
              containerPort: 8432
          envFrom:
            - configMapRef:
                name: pgbackrest-env
          env:
            - name: PGBACKREST_TLS_SERVER_ADDRESS
              value: "0.0.0.0"
            - name: PGBACKREST_TLS_SERVER_CA_FILE
              value: /tls/ca.crt
            - name: PGBACKREST_TLS_SERVER_CERT_FILE
              value: /tls/tls.crt
            - name: PGBACKREST_TLS_SERVER_KEY_FILE
              value: /tls/tls.key
            - name: PGBACKREST_TLS_SERVER_AUTH
              value: "pgbackrest-backup=pg-ha"
            - name: PGBACKREST_REPO1_S3_KEY
              valueFrom:
                secretKeyRef:
                  name: objstore-credentials
                  key: access-key-id
            - name: PGBACKREST_REPO1_S3_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: objstore-credentials
                  key: secret-access-key
          readinessProbe:
            tcpSocket:
              port: 8432
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /pgdata
              readOnly: true
            - name: run
              mountPath: /run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: pgserver-tls
              mountPath: /tls
              readOnly: true
            - name: objstore-ca
              mountPath: /certs
              readOnly: true
      volumes:
        - name: patroni-config
          configMap:
            name: patroni-static-config
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
        - name: objstore-ca
          secret:
            secretName: objstore-tls
            items:
              - key: ca.crt
                path: ca.crt
        - name: backup-scripts
          configMap:
            name: pgbackrest-scripts
        - name: pgserver-tls
          secret:
            secretName: pgbackrest-tls-server
            defaultMode: 288
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
