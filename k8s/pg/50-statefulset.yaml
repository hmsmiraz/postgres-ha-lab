apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pg-ha
  namespace: pg-ha
  labels:
    application: pg-ha
    cluster-name: pg-ha
spec:
  serviceName: pg-ha-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      application: pg-ha
      cluster-name: pg-ha
  template:
    metadata:
      labels:
        application: pg-ha
        cluster-name: pg-ha
    spec:
      serviceAccountName: patroni
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  application: pg-ha
                  cluster-name: pg-ha
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              application: pg-ha
              cluster-name: pg-ha
      containers:
        - name: postgres
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
            - name: patroni
              containerPort: 8008
          env:
            - name: PATRONI_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PATRONI_KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: PATRONI_KUBERNETES_POD_IP
              value: "$(POD_IP)"
            - name: PATRONI_RESTAPI_CONNECT_ADDRESS
              value: "$(POD_IP):8008"
            - name: PATRONI_POSTGRESQL_CONNECT_ADDRESS
              value: "$(POD_IP):5432"
            - name: PATRONI_SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-credentials
                  key: superuser-password
            - name: PATRONI_REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-credentials
                  key: replication-password
            - name: PATRONI_REWIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-credentials
                  key: rewind-password
            - name: PATRONI_RESTAPI_USERNAME
              value: patroni
            - name: PATRONI_RESTAPI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-credentials
                  key: restapi-password
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-credentials
                  key: app-password
          startupProbe:
            httpGet:
              path: /liveness
              port: 8008
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /liveness
              port: 8008
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8008
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /pgdata
            - name: patroni-config
              mountPath: /etc/patroni
              readOnly: true
            - name: run
              mountPath: /run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/postgres
      volumes:
        - name: patroni-config
          configMap:
            name: patroni-static-config
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
