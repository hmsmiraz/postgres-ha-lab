# OBS-1 (D2 a): Prometheus in pg-ha. Static targets, no RBAC, no service account token.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: pg-ha
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/rules/rules.yml
    scrape_configs:
      - job_name: patroni
        metrics_path: /metrics
        static_configs:
          - targets:
              - pg-ha-0.pg-ha-headless.pg-ha.svc.cluster.local:8008
              - pg-ha-1.pg-ha-headless.pg-ha.svc.cluster.local:8008
              - pg-ha-2.pg-ha-headless.pg-ha.svc.cluster.local:8008
      - job_name: postgres-exporter
        static_configs:
          - targets:
              - pg-ha-0.pg-ha-headless.pg-ha.svc.cluster.local:9187
              - pg-ha-1.pg-ha-headless.pg-ha.svc.cluster.local:9187
              - pg-ha-2.pg-ha-headless.pg-ha.svc.cluster.local:9187
      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics.pg-ha.svc.cluster.local:8080"]
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: pg-ha
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: pg-ha
  labels:
    app: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: pg-ha
  labels:
    app: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: __PROMETHEUS_IMAGE__
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
          ports:
            - name: web
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
