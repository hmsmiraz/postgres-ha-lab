apiVersion: v1
kind: Pod
metadata:
  name: write-probe
  namespace: pg-ha
  labels:
    app: write-probe
spec:
  restartPolicy: Never
  # Run on the control-plane node so worker failures do not kill the probe.
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      image: __IMAGE__
      imagePullPolicy: IfNotPresent
      command: ["bash", "-c"]
      args:
        - |
          while true; do
            ts=$(date +%s%3N)
            if PGCONNECT_TIMEOUT=1 PGOPTIONS='-c statement_timeout=3000' timeout 4 \
                 psql -h pg-primary -U app -d appdb -Atq \
                 -c "insert into fo_probe(ts_ms) values ($ts)" >/dev/null 2>&1; then
              echo "ok $ts"
            else
              echo "err $ts"
            fi
            sleep 0.1
          done
      env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: pg-credentials
              key: app-password
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
